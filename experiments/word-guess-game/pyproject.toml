[project]
name = "word-guess-game"
version = "0.1.0"
description = "Czech word guessing game (přihořívá hoří) with semantic embeddings and 2D visualizations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "simplemma>=1.0",
    "tqdm>=4.66",
    "httpx>=0.27",
    "orjson>=3.10",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
]
