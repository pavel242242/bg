<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Přihořívá hoří — hra s embeddingy</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🔥 Přihořívá hoří</h1>
    <p class="tag">Uhodni tajné české slovo. Po každém tipu uvidíš, jak je blízko.</p>
  </header>

  <main>
    <section class="controls">
      <form id="guess-form" autocomplete="off">
        <input id="guess-input" name="word" type="text" placeholder="Tvůj tip…" autofocus />
        <button type="submit">Tipnout</button>
      </form>
      <div class="control-row">
        <button id="new-game-btn" type="button">Nová hra</button>
        <button id="reveal-btn" type="button">Vzdát se</button>
        <label class="model-toggle">
          Model:
          <select id="model-select">
            <option value="fasttext">fastText cc.cs.300</option>
            <option value="simcse">SimCSE (Seznam)</option>
          </select>
        </label>
        <span id="status" class="status"></span>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-view="list">Seznam</button>
      <button class="tab" data-view="circles">Kruhy</button>
      <button class="tab" data-view="sky">Hvězdná obloha</button>
    </nav>

    <section id="view-list" class="view active">
      <div class="legend">
        <span class="hot">Hoří (top 50)</span>
        <span class="warm">Přihořívá (top 250)</span>
        <span class="tepid">Vlažné (top 1000)</span>
        <span class="cold">Studí</span>
      </div>
      <div id="last-guess-card" class="last-guess hidden"></div>
      <ol id="guess-list"></ol>
    </section>

    <section id="view-circles" class="view">
      <svg id="circles-svg"></svg>
    </section>

    <section id="view-sky" class="view">
      <div class="sky-controls">
        <button id="refresh-sky" type="button">Přepočítat souhvězdí</button>
        <span class="hint">UMAP projekce + minimum spanning tree</span>
      </div>
      <svg id="sky-svg"></svg>
    </section>
  </main>

  <footer>
    <span id="meta"></span>
  </footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
