name: Deploy DataTalk Sync

on:
  push:
    branches:
      - main
      - claude/learn-n8n-skills-ZSXUn
    paths:
      - 'datatalk-sync/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'datatalk-sync/**'
  workflow_dispatch:

env:
  SERVER_NAME: chochomesh
  HCLOUD_IMAGE: ubuntu-24.04
  HCLOUD_TYPE: cax11
  HCLOUD_LOCATION: nbg1
  MAX_SERVERS: 3

jobs:
  # ====================
  # Security & Quality
  # ====================
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          extra_args: --only-verified

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for potential secrets..."
          # Check for common secret patterns
          if grep -rE "(password|secret|api_key|token)\s*[:=]\s*['\"][^'\"]{8,}" \
             --include="*.json" --include="*.yml" --include="*.yaml" \
             datatalk-sync/ 2>/dev/null | grep -v ".example" | grep -v "secrets\." | grep -v '\$\{\{'; then
            echo "::error::Potential hardcoded secrets found!"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      - name: Check .env.example has no real values
        run: |
          if grep -E "^[A-Z_]+=.{20,}$" datatalk-sync/.env.example | grep -v "example\|changeme\|your-"; then
            echo "::error::.env.example may contain real credentials!"
            exit 1
          fi
          echo ".env.example looks safe"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON workflows
        run: |
          echo "Validating n8n workflow JSON files..."
          for file in datatalk-sync/workflows/*.json; do
            echo "Checking $file"
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error::Invalid JSON in $file"
              exit 1
            fi
          done
          echo "All workflow files are valid JSON"

      - name: Check docker-compose syntax
        run: |
          cd datatalk-sync
          docker compose config --quiet || {
            echo "::error::Invalid docker-compose.yml"
            exit 1
          }
          echo "docker-compose.yml is valid"

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: datatalk-sync/
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              truthy: disable

  # ====================
  # Deploy to Hetzner
  # ====================
  deploy:
    name: Deploy to Hetzner Cloud
    runs-on: ubuntu-latest
    needs: [security, quality]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install hcloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Check server count
        id: check-servers
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          SERVER_COUNT=$(hcloud server list -o noheader | wc -l)
          echo "Current server count: $SERVER_COUNT"
          echo "server_count=$SERVER_COUNT" >> $GITHUB_OUTPUT

          if [ "$SERVER_COUNT" -ge "$MAX_SERVERS" ]; then
            # Check if our server exists
            if ! hcloud server describe $SERVER_NAME > /dev/null 2>&1; then
              echo "::error::Max servers ($MAX_SERVERS) reached and $SERVER_NAME doesn't exist"
              exit 1
            fi
          fi

      - name: Generate cloud-init with secrets
        run: |
          # Create cloud-init.yml with secrets injected
          sed -e 's|__N8N_USER__|${{ secrets.N8N_USER }}|g' \
              -e 's|__N8N_PASSWORD__|${{ secrets.N8N_PASSWORD }}|g' \
              -e 's|__N8N_ENCRYPTION_KEY__|${{ secrets.N8N_ENCRYPTION_KEY }}|g' \
              -e 's|__WEBHOOK_URL__|${{ secrets.WEBHOOK_URL }}|g' \
              -e 's|__POSTGRES_PASSWORD__|${{ secrets.POSTGRES_PASSWORD }}|g' \
              -e 's|__OPENAI_API_KEY__|${{ secrets.OPENAI_API_KEY }}|g' \
              -e 's|__TELEGRAM_BOT_TOKEN__|${{ secrets.TELEGRAM_BOT_TOKEN }}|g' \
              -e 's|__SENDGRID_API_KEY__|${{ secrets.SENDGRID_API_KEY }}|g' \
              -e 's|__SMTP_SENDER__|${{ secrets.SMTP_SENDER }}|g' \
              -e 's|__SMTP_SENDER_DOMAIN__|${{ secrets.SMTP_SENDER_DOMAIN }}|g' \
              -e 's|__HCLOUD_TOKEN__|${{ secrets.HCLOUD_TOKEN }}|g' \
              cloud-init.yml > /tmp/cloud-init-with-secrets.yml
          
          echo "✅ Cloud-init generated with secrets"

      - name: Create or get server
        id: server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if hcloud server describe $SERVER_NAME > /dev/null 2>&1; then
            echo "⚠️  Server $SERVER_NAME already exists"
            SERVER_IP=$(hcloud server ip $SERVER_NAME)
            echo "server_created=false" >> $GITHUB_OUTPUT
            echo "server_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Creating server $SERVER_NAME..."

            # Create SSH key if not exists
            if ! hcloud ssh-key describe deploy-key > /dev/null 2>&1; then
              echo "${{ secrets.DEPLOY_SSH_KEY_PUB }}" > /tmp/deploy-key.pub
              hcloud ssh-key create --name deploy-key --public-key-from-file /tmp/deploy-key.pub
              rm /tmp/deploy-key.pub
            fi

            # Create server with cloud-init (includes secrets)
            hcloud server create \
              --name $SERVER_NAME \
              --type $HCLOUD_TYPE \
              --image $HCLOUD_IMAGE \
              --location $HCLOUD_LOCATION \
              --ssh-key deploy-key \
              --user-data-from-file /tmp/cloud-init-with-secrets.yml \
              --label app=datatalk-sync \
              --label managed-by=github-actions

            SERVER_IP=$(hcloud server ip $SERVER_NAME)
            echo "server_created=true" >> $GITHUB_OUTPUT
            echo "server_exists=false" >> $GITHUB_OUTPUT
          fi

          echo "Server IP: $SERVER_IP"
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT

      - name: Wait for cloud-init
        if: steps.server.outputs.server_created == 'true'
        env:
          SERVER_IP: ${{ steps.server.outputs.server_ip }}
        run: |
          echo "Waiting for cloud-init to complete..."

          # Setup SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for i in {1..30}; do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@$SERVER_IP "test -f /opt/.cloud-init-complete" 2>/dev/null; then
              echo "Cloud-init complete!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

          echo "::warning::Cloud-init may still be running"

      - name: Health check
        env:
          SERVER_IP: ${{ steps.server.outputs.server_ip }}
        run: |
          echo "Waiting for n8n to start..."
          sleep 15

          for i in {1..5}; do
            if curl -sf http://$SERVER_IP:5678/healthz > /dev/null 2>&1; then
              echo "n8n is healthy!"
              exit 0
            fi
            echo "Attempt $i/5 - waiting..."
            sleep 10
          done

          echo "::warning::Health check inconclusive - n8n may still be starting"

      - name: Output server info
        env:
          SERVER_IP: ${{ steps.server.outputs.server_ip }}
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** $SERVER_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**IP:** $SERVER_IP" >> $GITHUB_STEP_SUMMARY
          echo "**n8n URL:** http://$SERVER_IP:5678" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Remember to:" >> $GITHUB_STEP_SUMMARY
          echo "- Setup DNS to point to $SERVER_IP" >> $GITHUB_STEP_SUMMARY
          echo "- Configure HTTPS (use Caddy or nginx-proxy)" >> $GITHUB_STEP_SUMMARY
