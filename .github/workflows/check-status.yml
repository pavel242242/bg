name: Check n8n Status
on: workflow_dispatch

env:
  SERVER_NAME: chochomesh

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install hcloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Get server IP
        id: server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if ! hcloud server describe $SERVER_NAME > /dev/null 2>&1; then
            echo "::error::Server $SERVER_NAME does not exist"
            exit 1
          fi
          SERVER_IP=$(hcloud server ip $SERVER_NAME)
          echo "Server IP: $SERVER_IP"
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT

      - name: Check n8n health
        env:
          SERVER_IP: ${{ steps.server.outputs.server_ip }}
        run: |
          echo "Checking health via Caddy reverse proxy..."
          for i in {1..5}; do
            echo "Attempt $i..."
            # Try HTTPS first, then HTTP
            if curl -sf "https://$SERVER_IP/health" -k 2>/dev/null; then
              echo "HTTPS health check passed!"
              exit 0
            fi
            if curl -sf "http://$SERVER_IP/health" 2>/dev/null; then
              echo "HTTP health check passed!"
              exit 0
            fi
            sleep 5
          done
          echo "Trying to get more info..."
          curl -v "http://$SERVER_IP/health" 2>&1 | head -50
