services:
  # Local PostgreSQL - only starts with: docker compose --profile local up
  postgres:
    image: postgres:18-alpine
    container_name: datatalk-postgres
    profiles: ["local"]
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n_network

  n8n-init:
    image: n8nio/n8n:2.7.1
    container_name: datatalk-n8n-init
    restart: "no"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=${DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED:-true}
    volumes:
      - ./workflows:/workflows:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/n8n-init.sh"]
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n:2.7.1
    container_name: datatalk-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Webhook URL (for verification links)
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${WEBHOOK_URL}
      - N8N_PROTOCOL=https

      # Timezone
      - GENERIC_TIMEZONE=Europe/Prague
      - TZ=Europe/Prague

      # Allow HTTP access (no HTTPS)
      - N8N_SECURE_COOKIE=false

      # Enable Data Tables
      - N8N_ENABLED_MODULES=data-table

      # External services (available as $env in workflows)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # PostgreSQL Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=${DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED:-true}

      # SMTP (Direct SendGrid)
      - SMTP_HOST=smtp.sendgrid.net
      - SMTP_PORT=587
      - SMTP_SECURE=true
      - SMTP_USER=apikey
      - SMTP_PASS=${SENDGRID_API_KEY}
      - SMTP_SENDER=${SMTP_SENDER}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      n8n-init:
        condition: service_completed_successfully
    networks:
      - n8n_network

  data-tables-init:
    image: postgres:18-alpine
    container_name: datatalk-data-tables-init
    restart: "no"
    environment:
      - POSTGRES_HOST=${DB_POSTGRESDB_HOST}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - PGPASSWORD=${DB_POSTGRESDB_PASSWORD}
      - PGSSLMODE=${PGSSLMODE:-disable}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      n8n-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/create-data-tables.sh"]
    networks:
      - n8n_network

  n8n-post-init:
    image: alpine:latest
    container_name: datatalk-n8n-post-init
    restart: "no"
    environment:
      - N8N_HOST=http://n8n:5678
      - N8N_USER=${N8N_USER}
      - N8N_PASSWORD=${N8N_PASSWORD}
      - SMTP_HOST=smtp.sendgrid.net
      - SMTP_PORT=587
      - SMTP_USER=apikey
      - SMTP_PASS=${SENDGRID_API_KEY}
    volumes:
      - ./scripts:/scripts:ro
      - ./workflows:/workflows:ro
    depends_on:
      n8n:
        condition: service_healthy
      data-tables-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/n8n-post-init.sh"]
    networks:
      - n8n_network

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local

networks:
  n8n_network:
    driver: bridge
