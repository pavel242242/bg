#cloud-config

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git

write_files:
  - path: /root/.env
    permissions: '0600'
    content: |
      N8N_USER=__N8N_USER__
      N8N_PASSWORD=__N8N_PASSWORD__
      N8N_ENCRYPTION_KEY=__N8N_ENCRYPTION_KEY__
      WEBHOOK_URL=__WEBHOOK_URL__
      POSTGRES_PASSWORD=__POSTGRES_PASSWORD__
      OPENAI_API_KEY=__OPENAI_API_KEY__
      TELEGRAM_BOT_TOKEN=__TELEGRAM_BOT_TOKEN__
      SENDGRID_API_KEY=__SENDGRID_API_KEY__
      SMTP_SENDER=__SMTP_SENDER__
      SMTP_SENDER_DOMAIN=__SMTP_SENDER_DOMAIN__
      HCLOUD_TOKEN=__HCLOUD_TOKEN__

  - path: /etc/systemd/system/datatalk-sync.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DataTalk Sync Docker Compose
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/datatalk-sync
      ExecStartPre=/usr/bin/docker compose pull -q
      ExecStart=/usr/bin/docker compose up -d --remove-orphans
      ExecStop=/usr/bin/docker compose down

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Install Docker (idempotent)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Clone or update repository (idempotent)
  - |
    if [ -d /opt/bg ]; then
      echo "Repository exists, pulling latest..."
      cd /opt/bg && git fetch && git reset --hard origin/claude/learn-n8n-skills-ZSXUn
    else
      echo "Cloning repository..."
      git clone -b claude/learn-n8n-skills-ZSXUn https://github.com/chocholous/bg.git /opt/bg
    fi

  # Sync datatalk-sync directory (idempotent)
  - rm -rf /opt/datatalk-sync
  - cp -r /opt/bg/datatalk-sync /opt/

  # Make scripts executable
  - chmod +x /opt/datatalk-sync/scripts/*.sh

  # Copy .env to datatalk-sync directory
  - cp /root/.env /opt/datatalk-sync/.env

  # Enable and start systemd service (this starts everything via docker compose)
  - systemctl daemon-reload
  - systemctl enable datatalk-sync.service
  - systemctl start datatalk-sync.service

  # Wait for systemd service to complete
  - |
    echo "Waiting for datatalk-sync service to start..."
    for i in {1..60}; do
      if systemctl is-active --quiet datatalk-sync.service; then
        echo "Service active!"
        break
      fi
      sleep 2
    done

  # Wait for init containers to complete
  - |
    echo "Waiting for initialization containers..."
    for i in {1..60}; do
      if docker logs datatalk-n8n-post-init 2>&1 | grep -q "complete"; then
        echo "Initialization complete!"
        break
      fi
      sleep 5
    done

  # Verify deployment
  - docker ps -a
  - echo "=== n8n-init logs ==="
  - docker logs datatalk-n8n-init 2>&1 | tail -20
  - echo "=== n8n-post-init logs ==="
  - docker logs datatalk-n8n-post-init 2>&1 | tail -20

  # Signal ready
  - touch /opt/.cloud-init-complete
