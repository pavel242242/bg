#cloud-config

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git

write_files:
  - path: /root/.env
    permissions: '0600'
    content: |
      N8N_USER=__N8N_USER__
      N8N_PASSWORD=__N8N_PASSWORD__
      N8N_ENCRYPTION_KEY=__N8N_ENCRYPTION_KEY__
      WEBHOOK_URL=__WEBHOOK_URL__
      POSTGRES_PASSWORD=__POSTGRES_PASSWORD__
      OPENAI_API_KEY=__OPENAI_API_KEY__
      TELEGRAM_BOT_TOKEN=__TELEGRAM_BOT_TOKEN__
      SENDGRID_API_KEY=__SENDGRID_API_KEY__
      SMTP_SENDER=__SMTP_SENDER__
      SMTP_SENDER_DOMAIN=__SMTP_SENDER_DOMAIN__
      HCLOUD_TOKEN=__HCLOUD_TOKEN__

runcmd:
  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Clone specific branch
  - git clone -b claude/learn-n8n-skills-ZSXUn https://github.com/chocholous/bg.git /opt/bg
  - cp -r /opt/bg/datatalk-sync /opt/

  # Make scripts executable
  - chmod +x /opt/datatalk-sync/scripts/*.sh

  # Copy .env to datatalk-sync directory
  - cp /root/.env /opt/datatalk-sync/.env

  # Start Docker Compose stack (including init containers)
  - cd /opt/datatalk-sync && docker compose up -d

  # Wait for complete initialization
  - |
    echo "Waiting for n8n initialization..."
    for i in {1..60}; do
      if docker logs datatalk-n8n-post-init 2>&1 | grep -q "complete"; then
        echo "n8n fully initialized!"
        break
      fi
      sleep 5
    done

  # Verify deployment
  - docker ps
  - docker logs datatalk-n8n-init
  - docker logs datatalk-n8n-post-init

  # Signal ready
  - touch /opt/.cloud-init-complete
