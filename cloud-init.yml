#cloud-config

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git

runcmd:
  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Clone repo and deploy (use feature branch for testing)
  - git clone -b claude/debug-hetzner-deployment-52HnR https://github.com/chocholous/bg.git /opt/bg
  - mkdir -p /opt/datatalk-sync
  - cp -r /opt/bg/datatalk-sync/* /opt/datatalk-sync/

  # Create .env file with defaults (customize via hcloud user-data or manual edit)
  - |
    if [ -f /root/.env ]; then
      cp /root/.env /opt/datatalk-sync/.env
    else
      cat > /opt/datatalk-sync/.env << 'ENVEOF'
    N8N_USER=admin
    N8N_PASSWORD=changeme123
    N8N_ENCRYPTION_KEY=$(openssl rand -hex 16)
    WEBHOOK_URL=
    OPENAI_API_KEY=
    TELEGRAM_BOT_TOKEN=
    SMTP_HOST=
    SMTP_PORT=587
    SMTP_USER=
    SMTP_PASS=
    SMTP_SENDER=
    ENVEOF
      # Generate actual random encryption key
      sed -i "s/\$(openssl rand -hex 16)/$(openssl rand -hex 16)/" /opt/datatalk-sync/.env
    fi

  # Start n8n
  - cd /opt/datatalk-sync && docker compose pull && docker compose up -d

  # Signal ready
  - touch /opt/.cloud-init-complete
