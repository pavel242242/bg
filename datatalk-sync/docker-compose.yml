version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: datatalk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${WEBHOOK_URL:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - shellinabox
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  shellinabox:
    image: sspreitzer/shellinabox:latest
    container_name: datatalk-shell
    restart: unless-stopped
    expose:
      - "4200"
    environment:
      - SIAB_SSL=false
      - SIAB_SERVICE=/:SSH:172.17.0.1
      - SIAB_PKGS=openssh-client
      - SIAB_SCRIPT=hostname
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: n8nio/n8n:latest
    container_name: datatalk-n8n
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      # n8n Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}

      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Allow HTTP access (disable secure cookie requirement)
      - N8N_SECURE_COOKIE=false

      # Webhook URL (for verification links)
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${WEBHOOK_URL}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}

      # Timezone
      - GENERIC_TIMEZONE=Europe/Prague
      - TZ=Europe/Prague

      # External services (available as $env in workflows)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SENDER=${SMTP_SENDER}

    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
