version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datatalk-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n_network

  n8n-init:
    image: n8nio/n8n:latest
    container_name: datatalk-n8n-init
    restart: "no"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./workflows:/workflows:ro
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/n8n-init.sh"]
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n:latest
    container_name: datatalk-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # n8n Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}

      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Webhook URL (for verification links)
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${WEBHOOK_URL}
      - N8N_PROTOCOL=https

      # Timezone
      - GENERIC_TIMEZONE=Europe/Prague
      - TZ=Europe/Prague

      # Allow HTTP access (no HTTPS)
      - N8N_SECURE_COOKIE=false

      # External services (available as $env in workflows)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # PostgreSQL Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # SMTP (Direct SendGrid)
      - SMTP_HOST=smtp.sendgrid.net
      - SMTP_PORT=587
      - SMTP_SECURE=true
      - SMTP_USER=apikey
      - SMTP_PASS=${SENDGRID_API_KEY}
      - SMTP_SENDER=${SMTP_SENDER}

    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      n8n-init:
        condition: service_completed_successfully
    networks:
      - n8n_network

  n8n-post-init:
    image: curlimages/curl:latest
    container_name: datatalk-n8n-post-init
    restart: "no"
    environment:
      - N8N_HOST=http://n8n:5678
      - N8N_USER=${N8N_USER}
      - N8N_PASSWORD=${N8N_PASSWORD}
      - SMTP_HOST=smtp.sendgrid.net
      - SMTP_PORT=587
      - SMTP_USER=apikey
      - SMTP_PASS=${SENDGRID_API_KEY}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      n8n:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/n8n-post-init.sh"]
    networks:
      - n8n_network

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local

networks:
  n8n_network:
    driver: bridge
