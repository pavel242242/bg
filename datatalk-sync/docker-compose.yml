version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: datatalk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${WEBHOOK_URL:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: datatalk-n8n
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Allow HTTP access (disable secure cookie requirement)
      - N8N_SECURE_COOKIE=false

      # Webhook URL (for verification links)
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${WEBHOOK_URL}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}

      # Timezone
      - GENERIC_TIMEZONE=Europe/Prague
      - TZ=Europe/Prague

      # External services (available as $env in workflows)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SENDER=${SMTP_SENDER}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Init service to import workflows and create credentials
  n8n-init:
    image: n8nio/n8n:latest
    container_name: datatalk-n8n-init
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

volumes:
  n8n_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
