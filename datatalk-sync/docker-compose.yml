version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: datatalk-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # n8n Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}

      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Webhook URL (for verification links)
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${WEBHOOK_URL}
      - N8N_PROTOCOL=https

      # Timezone
      - GENERIC_TIMEZONE=Europe/Prague
      - TZ=Europe/Prague

      # Allow HTTP access (no HTTPS)
      - N8N_SECURE_COOKIE=false

      # External services (available as $env in workflows)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SENDER=${SMTP_SENDER}

    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
    driver: local
